<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALKA</title>
<style>
  :root {
    /* Quanto de rolagem equivale ao video inteiro. Aumente para o video passar mais devagar. */
    --scroll-length: 600vh;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #000; color: #fff; font-family: system-ui, sans-serif; }

  .intro, .outro {
    min-height: 100vh;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 24px;
  }
  .intro h1 { font-size: clamp(2rem, 6vw, 5rem); letter-spacing: .05em; }
  .intro p { opacity: .6; margin-top: 12px; }

  /* Trecho em que o video e controlado pelo scroll */
  .scrub { position: relative; height: var(--scroll-length); }
  .scrub .stage {
    position: sticky; top: 0;
    height: 100vh; width: 100%;
    overflow: hidden; background: #000;
  }
  .scrub video {
    width: 100%; height: 100%;
    object-fit: cover; /* use "contain" para nao cortar as bordas */
    display: block;
  }
  .progress {
    position: absolute; left: 0; bottom: 0; height: 3px;
    background: #fff; width: 0; opacity: .7;
  }
</style>
</head>
<body>

<section class="intro">
  <div>
    <h1>ALKA</h1>
    <p>Role para baixo</p>
  </div>
</section>

<section class="scrub" id="scrub">
  <div class="stage">
    <video id="vid" src="video-scroll.mp4" muted playsinline preload="auto"></video>
    <div class="progress" id="bar"></div>
  </div>
</section>

<section class="outro">
  <h2>Continue a pagina aqui</h2>
</section>

<script>
(() => {
  const video = document.getElementById('vid');
  const section = document.getElementById('scrub');
  const bar = document.getElementById('bar');

  const SMOOTH = 0.12; // 0 a 1: menor = mais suave/lento, maior = mais colado no scroll
  let target = 0;     // tempo desejado (segundos)
  let current = 0;    // tempo exibido
  let ready = false;

  function readScroll() {
    const rect = section.getBoundingClientRect();
    const total = section.offsetHeight - window.innerHeight;
    const p = Math.min(1, Math.max(0, -rect.top / total));
    target = p * (video.duration || 0);
    bar.style.width = (p * 100) + '%';
  }

  function loop() {
    if (ready) {
      current += (target - current) * SMOOTH;
      if (Math.abs(target - current) < 0.001) current = target;
      // so atualiza se mudou o suficiente (evita seeks inuteis)
      if (Math.abs(video.currentTime - current) > 0.005) {
        video.currentTime = current;
      }
    }
    requestAnimationFrame(loop);
  }

  video.addEventListener('loadedmetadata', () => {
    ready = true;
    video.pause();
    readScroll();
    current = target;
  });
  // Safari/iOS precisam de um play/pause inicial para liberar o seek
  video.addEventListener('canplay', () => {
    video.play().then(() => video.pause()).catch(() => {});
  }, { once: true });

  window.addEventListener('scroll', readScroll, { passive: true });
  window.addEventListener('resize', readScroll);
  video.load();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
